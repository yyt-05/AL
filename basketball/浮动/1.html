<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
.box::after{
    border: 2px solid rgb(54, 54, 54);
    width: 100%;
    height: 100px;
    background-color: rgb(255, 255, 255);
}
.left{
    width: 500px;
    height: 100px;
    background-color: red;
    float: left;
    margin: 10px;
}
.right{
    width: 500px;
    height: 100px;
    background-color: blue;
    float: right;
    margin: 10px;
}
    </style>
</head>
<body>
    <div class="box">
        <div class="left"></div>
        <div class="right"></div>

    </div>

</body>
</html>
