    <p>你眼里有星河万顷，掌心盛着不落的温柔 —— 明明是随手递来的热咖啡，杯壁温度却能暖到心尖；加班晚归时总能在路口看见你揣着热奶茶等我，睫毛被路灯镀成金边的样子，比任何浪漫电影都动人。你会蹲下身帮我系松掉的鞋带，记得我随口提过的零食口味，连吵架时红着耳朵讲道理的模样，都透着笨拙的认真。和你在一起后才发现，原来被人放在心尖上宠，是连下雨天踩进水坑，都会被你笑着揉乱头发说 “没关系，回家给你烘袜子” 的安心。你不是完美的超人，却把我的每个小心愿都变成了现实里的星光，让我相信这世间所有的美好，都不及你望向我时，眼睛里闪着的、专属于我的光。</p>
